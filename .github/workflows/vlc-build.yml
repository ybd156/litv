name: VLC Build (libvlc)

# 单独编译 libvlc，用于评估"自己编能不能瘦身"。
#
# 这是**实验性**工作流，不参与发布：
#   - 只在手动触发时运行（不随 push 跑）
#   - 产物只作为 artifact，不会进 Release
#
# 现实预期（先看这段再点运行）：
#   VLC 的构建要先编一整套 contrib（ffmpeg、libdvbpsi、zlib…），
#   官方 CI 用的是自己的多核 runner + ccache。GitHub 免费 runner 只有
#   2~4 核，冷构建单个架构通常要 2~4 小时，很可能撞上 6 小时上限。
#   失败是大概率结果——这一步的目的是"拿到事实"，不是"一定成功"。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        type: choice
        options: [arm, arm64]
        default: arm
      image_tag:
        description: "VideoLAN 构建镜像 tag（拉不到就说明 tag 过期，换一个）"
        default: "20260701183656"

concurrency:
  group: vlc-build-${{ github.event.inputs.arch }}
  cancel-in-progress: true

jobs:
  build-libvlc:
    # 官方 CI 就是在 Debian 容器里跑 compile.sh 的，直接用同一个镜像
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 留在 GitHub 6 小时上限以内，避免被强杀看不到日志
    container:
      image: registry.videolan.org/vlc-debian-android-3.0:${{ github.event.inputs.image_tag }}
      options: --user root
    steps:
      - name: 确认构建环境
        run: |
          echo "arch=${{ github.event.inputs.arch }}"
          cat /etc/os-release | head -3
          which clang || true
          echo "ANDROID_NDK=${ANDROID_NDK:-未设置}"

      - name: 拉取 vlc-android
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 https://code.videolan.org/videolan/vlc-android.git /src
          cd /src
          git log --oneline -1

      - name: 编译 libvlc（只编库，不编 App）
        working-directory: /src
        run: |
          ./buildsystem/compile.sh -l -a ${{ github.event.inputs.arch }} -t 2>&1 | tail -200

      - name: 列出产物
        if: always()
        run: |
          echo "=== libvlcjni 产物 ==="
          find /src/libvlcjni -name "*.so" -printf "%s\t%p\n" 2>/dev/null | sort -rn | head -20 || echo "没有 .so"

      - name: 上传 libvlc 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-${{ github.event.inputs.arch }}
          path: |
            /src/libvlcjni/libvlc/jni/libs/**/*.so
            /src/.dbg/**/*
          if-no-files-found: warn
          retention-days: 7
