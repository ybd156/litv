name: Build iOS unsigned IPA

# =============================================================================
# 在 macOS runner 上编 iOS App 并产出**未签名** .ipa。
#
# 为什么走 CI 而不是 WSL：
#   WSL 里编 iOS 需要 xtool（Linux 上的 Xcode 替代），实测卡在 Swift 6.4.1
#   的产物落盘问题 + 系统 C 库头文件。macOS runner 自带 Xcode，
#   这些问题一个都不存在，代价只是写一份 project.yml（xcodegen 生成工程）。
#
# 产物：LITV-unsigned.ipa —— 用户自己用 Sideloadly / SideStore 签名安装。
# =============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    # 用 macos-latest 而不是钉死 macos-14：实测 macos-14 标签在这个账号下
    # 会让 job 在 3 秒内被取消（连 step 都没跑），换成 latest 正常。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 xcodegen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          xcodegen generate
          ls -la

      - name: 安装 CocoaPods 依赖（MobileVLCKit）
        working-directory: ios
        run: |
          # 用 VLCKit 而不是自编 libmpv：libmpv 在 iOS 上要编六层依赖
          # （uavs3d/ffmpeg/fribidi/freetype/libass/mpv），
          # 而 MobileVLCKit 是预编译 xcframework，能力覆盖更全（AC3/DTS/TS）。
          pod install --repo-update 2>&1 | tail -20
          ls -la *.xcworkspace

      - name: 编译（不签名）
        working-directory: ios
        run: |
          # 有 Pod 之后必须用 .xcworkspace 而不是 .xcodeproj
          xcodebuild \
            -workspace LITV.xcworkspace \
            -scheme LITV \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tail -80



      - name: 打包未签名 ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/LITV.app"
          test -d "$APP" || { echo "没找到 LITV.app"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf Payload LITV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 未签名包必须去掉签名残留，否则侧载工具会报错
          rm -rf Payload/LITV.app/_CodeSignature Payload/LITV.app/embedded.mobileprovision
          zip -qry LITV-unsigned.ipa Payload
          ls -lh LITV-unsigned.ipa
          unzip -l LITV-unsigned.ipa | head -12

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: LITV-unsigned-ipa
          path: ios/LITV-unsigned.ipa
          retention-days: 30

      - name: 失败时打印日志
        if: failure()
        run: |
          find ios/build -name "*.log" 2>/dev/null | head -5
          echo "--- 常见原因 ---"
          echo "1. project.yml 里的 bundle id / deploymentTarget 与代码不匹配"
          echo "2. SwiftUI 用了 iOS 15+ API 但 deploymentTarget 设成 14.0"
          echo "3. 缺少 Info.plist 的 NSAppTransportSecurity（HTTP 源站会被拒）"
