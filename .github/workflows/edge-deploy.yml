# 边缘降级部署（edge/）。
#
# 注意：这是**可选的**部署工作流。deploy 任务需要三个 Secrets：
#   BIND_CODE / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# 缺任何一个就整体跳过部署（只跑 check），不会让 main 变红。
# 另有两个可选项：
#   ADMIN_PASSWORD      —— 管理台口令；不配则退回 BIND_CODE（弱口令）
#   GITHUB_DISPATCH_TOKEN —— 管理台的「立即重建」按钮
#
# 只改 edge/ 才会触发，避免普通提交白白重建一遍。
name: Edge Deploy

# 只需要读仓库。默认权限是 read-write，这里显式收紧：
# 少一个写权限就少一条「改 workflow 去读 Secrets」的路径。
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      # 自带管理台会被构建进静态资源，改了也要重新发
      - "admin/**"
      - ".github/workflows/edge-deploy.yml"
  pull_request:
    paths:
      - "edge/**"
      - "admin/**"
  schedule:
    # 每天一次，UTC 19:00 = 北京时间凌晨 3:00。
    #
    # 以前是每小时一次（"17 * * * *"），两个问题：
    #   1. D1 免费版每天只有 10 万行写入，小时级重建 + 节目单刷新
    #      会实打实吃掉部署者自己的额度 —— 那不是我们能替人花的钱
    #   2. GitHub 的 cron 本来就不保证准点，实测**整整跳过 6 小时**，
    #      所谓"每小时一次"的可靠性是假的
    # 面板下发的 sign 地址实测 98 分钟后仍然有效，一天一换够用。
    # 需要立刻刷新时：管理台「立即重建」，或手动跑这个工作流。
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: edge-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: edge

jobs:
  # 所有工具链（node 依赖、tsc、wrangler）只在 CI 里装。
  # 本地不搭环境，见 AGENTS.md §8。
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 自测
        run: npm test

      - name: 打包检查（不部署）
        run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir=.wrangler/dry

  deploy:
    needs: check
    # PR 只跑检查，绝不部署
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # 必需的三个 Secret 缺任何一个就整体跳过部署。
      # 否则仓库还没配置时，每次改 edge/ 都会在 main 上红一次。
      # 注意不再要求 SOURCE_URLS：源现在配在管理台（D1 的 sources 表）。
      CONFIGURED: ${{ secrets.BIND_CODE != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # 只在这里留「有没有配」的布尔值，真正的值放在用到它的那一步。
      # 挂在 job 级 env 上会让两次 npm ci 和 build.mjs 全程都能读到它，
      # 暴露面白白变宽。
      HAS_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD != '' }}
      HAS_ADMIN_PATH: ${{ secrets.ADMIN_PATH != '' }}
      # ★ GitHub 的 Secret 名**不能以 GITHUB_ 开头**（会直接拒存：
      # "Secret names must not start with GITHUB_"）。所以 GitHub 这边叫
      # DISPATCH_TOKEN，写进 Worker 时再改成 GITHUB_DISPATCH_TOKEN
      # ——Worker 的环境变量名不受这个限制，代码里继续用原名。
      HAS_GH_TOKEN: ${{ secrets.DISPATCH_TOKEN != '' }}
    steps:
      - name: 未配置 Secrets，跳过部署
        if: env.CONFIGURED != 'true'
        # 这一步跑在 checkout 之前，edge/ 还不存在，所以必须覆盖掉
        # 顶层的 working-directory: edge，否则 bash 起不来。
        working-directory: .
        run: |
          echo "::notice::未配置 BIND_CODE / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署。配置方法见 edge/README.md"

      # 没配 ADMIN_PASSWORD 时管理台登不进去（绑定码已经不能当口令用）。
      # 不阻断部署——Worker 该发还是要发，否则连管理台都打不开去配东西；
      # 但必须在 Actions 摘要里留一条显眼的警告，别让人事后一脸懵。
      - name: 提醒未配管理台密码
        if: env.CONFIGURED == 'true' && env.HAS_ADMIN_PASSWORD != 'true'
        working-directory: .
        run: |
          echo "::warning::没有配置 ADMIN_PASSWORD——管理台将无法登录（绑定码不再能当管理台口令）。去 Settings → Secrets 加一个。"

      - uses: actions/checkout@v7
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-node@v7
        if: env.CONFIGURED == 'true'
        with:
          node-version: "24"

      - name: 安装依赖
        if: env.CONFIGURED == 'true'
        run: npm ci --no-audit --no-fund

      # 先建表：sources / kv 表要先存在，下一步才能读源清单。
      - name: 建表（幂等）
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute DB --remote --file=schema.sql

      # 源清单是管理台维护的，CI 只读。读失败就让这一步红掉——
      # 以前吞掉错误会表现为"重建成功但一个频道都没有"，极难排查。
      - name: 读取源清单与节目单状态
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 d1 execute DB --remote --json \
            --command "SELECT id, name, url, ua, referer FROM sources WHERE enabled = 1 ORDER BY sort, id" \
            > sources.json
          # sources.json 里的 url 通常带账号密码。这个仓库是 public，
          # 一旦 echo/head 出来就是永久泄露——所以这里绝对不能打印它。
          # 只数一下条数，既能看到"读到了几条"，又不泄露任何地址。
          echo "源清单条数：$(grep -o '"url"' sources.json | wc -l)"
          # 节目单至少隔 6 小时才刷：D1 免费版每天只给 10 万行写入
          npx --yes wrangler@4.158.0 d1 execute DB --remote --json \
            --command "SELECT v FROM kv WHERE k = 'last_epg_at'" \
            > epg-state.json
          # 一次查询取两行：上次重建的统计（缩水护栏）+ 屏蔽清单（生成期过滤）。
          # 合成一条是为了不多花一次 D1 查询。
          npx --yes wrangler@4.158.0 d1 execute DB --remote --json \
            --command "SELECT k, v FROM kv WHERE k IN ('last_build', 'blocked')" \
            > build-state.json

      # 生成失败会 exit 1，后面的部署全部短路，线上继续用上一次的好数据。
      #
      # 为什么要 tee + 单独一步写 summary：这一步失败时后面全 skipped，
      # 用户只能去翻 Actions 的原始日志才知道为什么（"重建失败"这四个字
      # 什么也说明不了）。写到 Step Summary 会直接显示在运行页面上。
      - name: 生成播放列表与 seed.sql
        if: env.CONFIGURED == 'true'
        env:
          SOURCES_FILE: sources.json
          EPG_STATE_FILE: epg-state.json
          BUILD_STATE_FILE: build-state.json
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          SOURCE_UA: ${{ secrets.SOURCE_UA }}
          # 换源 / 大改订阅时频道数会正常下跌，而缩水护栏会把它当成故障拦下来。
          # 要放行一次：仓库 Settings → Secrets and variables → Actions →
          # **Variables** 标签页 → New repository variable，名字 ALLOW_SHRINK，值 1。
          # 用 variable 而不是 secret：它不是机密，而且值要在日志里看得见才好排查。
          ALLOW_SHRINK: ${{ vars.ALLOW_SHRINK }}
        # pipefail：不加的话 `| tee` 会把退出码变成 tee 的 0，
        # 生成失败也显示成功——那比失败更糟。
        run: |
          set -o pipefail
          node scripts/build.mjs 2>&1 | tee build.log

      - name: 把生成失败的原因贴到运行摘要
        if: failure() && env.CONFIGURED == 'true'
        run: |
          echo "## ❌ 生成播放列表失败：线上仍在使用上一次的数据" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(没有 build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 灌数据
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute DB --remote --file=sql/seed.sql

      - name: 灌节目单
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute DB --remote --file=sql/epg.sql

      - name: 回写源状态与重建信息
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 d1 execute DB --remote --file=sql/source-status.sql
          npx --yes wrangler@4.158.0 d1 execute DB --remote --file=sql/meta.sql

      # 用 LITV2 自带的管理台（admin/ 的 Vue），不是另写一套。
      # base 改成 /：边缘这边它挂在根路径，这样它内部的相对 api/v1 正好落到
      # Worker 的 /api/v1/*。默认的 /app/litv/ 是给飞牛网关用的。
      - name: 构建自带管理台
        if: env.CONFIGURED == 'true'
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/

      - name: 把管理台放进静态资源
        if: env.CONFIGURED == 'true'
        working-directory: .
        run: |
          rm -rf edge/public/assets
          cp -r admin/dist/. edge/public/
          ls -la edge/public | head

      - name: 部署
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --var 把「哪个仓库/工作流/分支」写进 Worker 的环境变量：
        # 管理台的「立即重建」要按这个去 dispatch，以前是代码里写死仓库名，
        # fork 出去的人点了必然 404。这里用 CI 的真实仓库，fork 不用改代码。
        run: |
          npx --yes wrangler@4.158.0 deploy \
            --var GITHUB_REPO:${{ github.repository }} \
            --var GITHUB_WORKFLOW:edge-deploy.yml \
            --var GITHUB_REF:${{ github.ref_name }}

      # 放在 deploy 之后：Worker 不存在时 secret put 会失败。
      # 每次覆盖写入，改 Secret 就生效，不需要额外操作。
      - name: 写入绑定码
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIND_CODE: ${{ secrets.BIND_CODE }}
        run: printf '%s' "$BIND_CODE" | npx --yes wrangler@4.158.0 secret put BIND_CODE

      # 管理台口令。必须配：绑定码已经不能当管理台口令了（6 位数字太弱），
      # 没配的话管理台登不进去——deploy job 开头会打一条 warning。
      - name: 写入管理台口令（可选）
        if: env.CONFIGURED == 'true' && env.HAS_ADMIN_PASSWORD == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        # printf 不加换行，echo 会多一个：口令末尾多 \n 是登录失败的头号原因
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4.158.0 secret put ADMIN_PASSWORD

      # 可选：管理台入口路径。配了之后只有 /<这个名字> 能打开管理台，
      # 根路径与 /admin.html 一律 404（扫描器拿不到登录页）。
      #
      # ★ 只在**配了值**时才写。之前这里无条件 put，于是没配 ADMIN_PATH secret 的
      # 部署每次都会被一个空串覆盖，把别人手配在 Worker 上的入口清掉——
      # 「配好的 /admin 突然 404」就是这么来的。
      # 要清空入口：`npx wrangler secret delete ADMIN_PATH`，或者删掉这个 secret 后手动删。
      - name: 写入管理台入口（可选）
        if: env.CONFIGURED == 'true' && env.HAS_ADMIN_PATH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: printf '%s' "$ADMIN_PATH" | npx --yes wrangler@4.158.0 secret put ADMIN_PATH

      # 可选：配了它，管理台才有「立即重建」按钮。
      #
      # GitHub Secret 叫 DISPATCH_TOKEN（不能叫 GITHUB_DISPATCH_TOKEN，
      # GitHub 拒绝以 GITHUB_ 开头的名字）；写进 Worker 时用 GITHUB_DISPATCH_TOKEN，
      # 因为 Worker 的环境变量名没有这个限制，代码里也一直是这个名字。
      - name: 写入 GitHub 触发令牌（可选）
        if: env.CONFIGURED == 'true' && env.HAS_GH_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | npx --yes wrangler@4.158.0 secret put GITHUB_DISPATCH_TOKEN
