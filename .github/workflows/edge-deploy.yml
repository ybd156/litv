# 边缘降级部署（edge/）。
#
# 注意：这是**可选的**部署工作流，需要在本仓库配好四个 Secrets 才会成功：
#   SOURCE_URLS / BIND_CODE / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# 没配的话 deploy 会失败，但不影响 check 任务，也不影响其它工作流。
#
# 只改 edge/ 才会触发，避免普通提交白白重建一遍。
name: Edge Deploy

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      # 自带管理台会被构建进静态资源，改了也要重新发
      - "admin/**"
      - ".github/workflows/edge-deploy.yml"
  pull_request:
    paths:
      - "edge/**"
      - "admin/**"
  schedule:
    # 每小时一次，不是每天。
    # 很多面板（比如 live.ottiptv.cc）在 m3u 里下发的是**带 sign 的临时地址**，
    # 每次拉取都不一样、会过期。每天重建一次的话，隔天线路就播不动了。
    # public 仓库的 runner 免费，多跑几次不花钱。
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: edge-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: edge

jobs:
  # 所有工具链（node 依赖、tsc、wrangler）只在 CI 里装。
  # 本地不搭环境，见 AGENTS.md §8。
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 自测
        run: npm test

      - name: 打包检查（不部署）
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler/dry

  deploy:
    needs: check
    # PR 只跑检查，绝不部署
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # 必需的三个 Secret 缺任何一个就整体跳过部署。
      # 否则仓库还没配置时，每次改 edge/ 都会在 main 上红一次。
      # 注意不再要求 SOURCE_URLS：源现在配在管理台（D1 的 sources 表）。
      CONFIGURED: ${{ secrets.BIND_CODE != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
      SOURCE_URLS_FALLBACK: ${{ secrets.SOURCE_URLS }}
    steps:
      - name: 未配置 Secrets，跳过部署
        if: env.CONFIGURED != 'true'
        # 这一步跑在 checkout 之前，edge/ 还不存在，所以必须覆盖掉
        # 顶层的 working-directory: edge，否则 bash 起不来。
        working-directory: .
        run: |
          echo "::notice::未配置 BIND_CODE / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署。配置方法见 edge/README.md"

      - uses: actions/checkout@v7
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-node@v7
        if: env.CONFIGURED == 'true'
        with:
          node-version: "24"

      - name: 安装依赖
        if: env.CONFIGURED == 'true'
        run: npm install --no-audit --no-fund

      # 先建表：sources / kv 表要先存在，下一步才能读源清单。
      - name: 建表（幂等）
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute DB --remote --file=schema.sql

      # 源清单是管理台维护的，CI 只读。读失败就让这一步红掉——
      # 以前吞掉错误会表现为"重建成功但一个频道都没有"，极难排查。
      - name: 读取源清单
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --json \
            --command "SELECT id, name, url, ua, referer FROM sources WHERE enabled = 1 ORDER BY sort, id" \
            > sources.json
          echo "源清单前 300 字节："
          head -c 300 sources.json; echo

      # 生成失败会 exit 1，后面的部署全部短路，线上继续用上一次的好数据。
      - name: 生成播放列表与 seed.sql
        if: env.CONFIGURED == 'true'
        env:
          SOURCES_FILE: sources.json
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          SOURCE_UA: ${{ secrets.SOURCE_UA }}
        run: node scripts/build.mjs

      - name: 灌数据
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute DB --remote --file=sql/seed.sql

      - name: 回写源状态与重建信息
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --file=sql/source-status.sql
          npx --yes wrangler@4 d1 execute DB --remote --file=sql/meta.sql

      # 用 LITV2 自带的管理台（admin/ 的 Vue），不是另写一套。
      # base 改成 /：边缘这边它挂在根路径，这样它内部的相对 api/v1 正好落到
      # Worker 的 /api/v1/*。默认的 /app/litv/ 是给飞牛网关用的。
      - name: 构建自带管理台
        if: env.CONFIGURED == 'true'
        working-directory: admin
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/

      - name: 把管理台放进静态资源
        if: env.CONFIGURED == 'true'
        working-directory: .
        run: |
          rm -rf edge/public/assets
          cp -r admin/dist/. edge/public/
          ls -la edge/public | head

      - name: 部署
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 首次运行会创建 Worker。正式用之前把版本钉死，例如 wrangler@4.42.0
        run: npx --yes wrangler@4 deploy

      # 放在 deploy 之后：Worker 不存在时 secret put 会失败。
      # 每次覆盖写入，改 Secret 就生效，不需要额外操作。
      - name: 写入绑定码
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIND_CODE: ${{ secrets.BIND_CODE }}
        run: echo "$BIND_CODE" | npx --yes wrangler@4 secret put BIND_CODE

      # 可选：配了它，管理台才有「立即重建」按钮。
      - name: 写入 GitHub 触发令牌（可选）
        if: env.CONFIGURED == 'true' && env.GH_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "$GH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN
