name: Release

# =============================================================================
# 一键出三端安装包并发布到 Releases。
#
# 产物：
#   LITV-<ver>-tv-armv7.apk    ← 电视版 32 位（Android 9 老盒子，约 68MB）
#   LITV-<ver>-tv-arm64.apk    ← 电视版 64 位（约 75MB）
#   LITV-<ver>-phone-armv7.apk ← 手机版 32 位
#   LITV-<ver>-phone-arm64.apk ← 手机版 64 位（绝大多数手机装这个）
#   litv_x86_<ver>.fpk         ← 飞牛 NAS（N100 等 x86）
#   litv_arm_<ver>.fpk         ← 飞牛 NAS（ARM 机型）
#   LITV-<ver>-unsigned.ipa    ← iOS（未签名，自己用 Sideloadly 签）
#
# 触发：手动 workflow_dispatch，或推 v* tag。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空用仓库里的 0.0.1）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEFAULT_VERSION: "0.1.13"

jobs:
  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 确认 Android SDK 组件
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      - name: 还原发布签名密钥（可选）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 仓库里那份 legacy keystore 是公开的，只能用来自证"能覆盖升级"，
          # 不能证明包是我们发的。配了 secret 就用私钥，没配则回落（并告警）。
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，使用仓库内公开的 legacy 密钥签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          chmod 600 "$RUNNER_TEMP/keystore/release.jks"
          echo "LITV_KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: 构建 APK（release，已签名）
        working-directory: android
        env:
          LITV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LITV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LITV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 用 setup-gradle 装的 gradle 命令（仓库里没有 gradlew wrapper）。
          # 签名材料由上面的步骤写进 LITV_KEYSTORE_FILE；没配 secret 时
          # 回落到仓库内的 legacy keystore，CI 不需要额外配置也能出包。
          gradle --no-daemon assembleRelease

      - name: 校验签名方案（必须 v1+v2+v3 全 true）
        run: |
          APK=android/app/build/outputs/apk/tv/release/app-tv-armeabi-v7a-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v "$APK" | tee /tmp/sig.txt
          for v in v1 v2 v3; do
            grep -q "Verified using $v scheme.*: true" /tmp/sig.txt \
              || { echo "❌ $v 签名缺失"; exit 1; }
          done
          echo "✅ v1+v2+v3 签名齐全"

      - name: 收集 APK
        run: |
          mkdir -p out
          V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          # 电视版 / 手机版分开出包（flavor: tv / phone），
          # 每个 flavor 再按 ABI 拆成 armv7 / arm64 两个包。
          APK=android/app/build/outputs/apk
          cp $APK/tv/release/app-tv-armeabi-v7a-release.apk      "out/LITV-${V}-tv-armv7.apk"
          cp $APK/tv/release/app-tv-arm64-v8a-release.apk        "out/LITV-${V}-tv-arm64.apk"
          cp $APK/phone/release/app-phone-armeabi-v7a-release.apk "out/LITV-${V}-phone-armv7.apk"
          cp $APK/phone/release/app-phone-arm64-v8a-release.apk   "out/LITV-${V}-phone-arm64.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/*.apk

  # ---------------------------------------------------------------- fnOS fpk
  fpk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 构建管理台
        working-directory: admin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 下载 fnpack
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /tmp/fnpack
          mkdir -p ~/.local/bin && cp /tmp/fnpack ~/.local/bin/fnpack
          ~/.local/bin/fnpack --help | head -3

      - name: 打 fpk（x86 + arm）
        run: |
          cd packaging/fnos
          chmod +x build.sh
          # build.sh 会在编译 Go 之前把 admin/dist 同步进 go:embed 路径，
          # 所以这里不需要额外拷前端——同步是脚本的唯一机制。
          ./build.sh --arch x86
          ./build.sh --arch arm
          ls -lh dist/

      - name: 验证前端确实进了包（R11 门禁）
        run: |
          set -o pipefail
          # 服务端用 go:embed 打静态资源。若构建顺序错了，
          # 包会静默带着上一次的前端，而构建一路显示成功。
          # 这里断言 embed 与本次 dist 一致、且资源引用齐全。
          bash build/test/verify-frontend-embed.sh packaging/fnos/dist/litv_x86_v*.fpk

      - name: 收集 fpk
        run: |
          mkdir -p out
          V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          cp packaging/fnos/dist/litv_x86_v*.fpk "out/litv_x86_${V}.fpk"
          cp packaging/fnos/dist/litv_arm_v*.fpk "out/litv_arm_${V}.fpk"
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: fnos-fpk
          path: out/*.fpk

  # ---------------------------------------------------------------- iOS ipa
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: 安装工具
        run: brew install xcodegen

      - name: 生成工程 + 装 Pod
        working-directory: ios
        run: |
          xcodegen generate
          pod install --repo-update 2>&1 | tail -10

      - name: 编译（不签名）
        working-directory: ios
        run: |
          # ⚠️ pipefail 不能少：否则 xcodebuild 失败会被 tail 的退出码盖掉，
          #    表现为"构建成功但 ipa 里没有主二进制"（踩过）。
          set -o pipefail
          xcodebuild \
            -workspace LITV.xcworkspace \
            -scheme LITV \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tail -60

      - name: 打包未签名 ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/LITV.app"
          test -d "$APP" || { echo "没找到 LITV.app"; exit 1; }
          # 主二进制必须存在——防"假成功"（构建失败但产物目录是空的）
          test -f "$APP/LITV" || { echo "LITV.app 里没有主二进制，构建其实失败了"; exit 1; }
          rm -rf Payload LITV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/LITV.app/_CodeSignature Payload/LITV.app/embedded.mobileprovision
          zip -qry LITV-unsigned.ipa Payload
          ls -lh LITV-unsigned.ipa

      - name: 收集 ipa
        run: |
          mkdir -p out
          V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          cp ios/LITV-unsigned.ipa "out/LITV-${V}-unsigned.ipa"
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: out/*.ipa

  # ---------------------------------------------------------------- 发 Release
  release:
    needs: [android, fpk, ios]
    # iOS 失败不该拖住安卓和飞牛包：
    #   - android / fpk 必须成功（没有它们发布没意义）
    #   - ios 只要"跑完了"就放行，成功就带上 ipa，失败就只发安卓和 fpk
    # 之前写成 needs 三者全成功，结果 macOS runner 排队被取消，
    # 整个 0.1.11 一个产物都没发出去。
    if: |
      always() &&
      needs.android.result == 'success' &&
      needs.fpk.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理文件
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.apk" -o -name "*.fpk" -o -name "*.ipa" \) -exec cp {} out/ \;
          ls -lh out/

      - name: 生成 sha256
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          TAG="v${V}"

          # 已存在就先删（允许重跑覆盖）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # 发布说明 = 下载指引 + 该版本的 CHANGELOG 段落
          # （说明放仓库文件里，不在 YAML 里写 heredoc——
          #   YAML 块标量不允许顶格内容，heredoc 会把它截断）
          cp docs/release-notes.md /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "## 本版变化" >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          # 用 index() 而不是正则：awk 里 "\[" 这种转义不可靠
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md >> /tmp/notes.md
          echo "" >> /tmp/notes.md
          echo "完整更新日志见 [CHANGELOG.md](../blob/main/CHANGELOG.md)。" >> /tmp/notes.md
          echo "----- 发布说明预览 -----"
          head -50 /tmp/notes.md

          gh release create "$TAG" out/* \
            --title "LITV ${V}" \
            --notes-file /tmp/notes.md

      - name: 打印 Release 地址
        run: echo "https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version || env.DEFAULT_VERSION }}"

      - name: 同步 README 下载表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 为什么不靠 readme-downloads.yml 的 release:published 事件：
          # 用 GITHUB_TOKEN 创建的 Release **不会再触发其它工作流**
          # （GitHub 防止递归的规则），那个事件根本不会到达。
          # 所以在这里直接同步，readme-downloads.yml 只留作手动触发。
          git fetch --quiet origin main
          git checkout --quiet main
          git reset --quiet --hard origin/main

          python3 tools/ops/update-downloads.py

          if git diff --quiet README.md; then
            echo "README 已是最新，跳过提交"
            exit 0
          fi

          V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: README 下载表同步到 v${V} [skip ci]"
          git push origin HEAD:main
