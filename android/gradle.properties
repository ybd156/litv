# JVM 参数：TV 盒子开发机内存不一定大，给 Gradle 留够但别贪
# preferIPv4Stack：WSL 里 JVM 会优先走 IPv6，而本机 IPv6 出口不通，
# 表现是每个仓库都"Connect timed out"（curl 却正常），必须强制 IPv4。
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- 网络容错（这几点在国内网络下是刚需）----
systemProp.java.net.preferIPv4Stack=true
# 默认 30s 连接超时经常不够，抖动一下整次构建就废了
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# 每个仓库的重试次数
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=800
