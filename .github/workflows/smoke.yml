name: Smoke

# 隔离测试：确认这个仓库的 Actions 本身能不能跑起来。
# 如果连这个都被瞬间 cancelled，说明是仓库/账号级限制，而不是 iOS workflow 的问题。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smoke.yml"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: say hi
        run: |
          echo "runner ok"
          uname -a
